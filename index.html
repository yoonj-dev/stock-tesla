<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E82127" />
    <title>Tesla on Tap · 테슬라(TSLA) AI 로보택시 & 메가팩 퀀트 인텔리전스 허브</title>
    <meta name="description" content="테슬라(Tesla, TSLA) 실시간 시세, 로보택시 사이버캡, 메가팩 에너지 스토리지, 옵티머스 휴머노이드 6대 엔진 및 역DCF 밸류에이션 터미널" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:title" content="Tesla on Tap · 테슬라(TSLA) 퀀트 인텔리전스" />
    <meta property="og:description" content="로보택시, 메가팩, 옵티머스 6대 핵심 비즈니스 엔진 및 실시간 터미널" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://tsla.on-tap.xyz" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tesla_theme') || 'auto';
          var isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] dark:bg-[#09090b] text-slate-900 dark:text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Brand-UI Floating Donation Widget -->
    <script>
      window.BrandUIConfig = {
        appKey: 'tesla-on-tap',
        concept: 'beer',
        donationButtonPosition: 'bottom-right',
        theme: 'auto',
        lang: 'auto'
      };
    </script>
    <script src="https://brand-ui.on-tap.xyz/widget.js" async></script>
  </body>
</html>
